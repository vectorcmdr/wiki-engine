<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Engine</title>
  <link rel="icon" href="/docs/favicon.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Mono', monospace;
      background: #f5f5f0;
      background-image: radial-gradient(circle, #d1d1c8 1px, transparent 1px);
      background-size: 4px 4px;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      padding-bottom: 0;
    }
    main { transform: translateY(-75px); }
    .site-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      border-top: 1px solid #c8c8c0;
      padding: 0.6rem 1.5rem;
      font-size: 0.6rem;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      align-items: center;
      background: #f5f5f0;
    }
    .site-footer a { color: #888; text-decoration: none; font-weight: 500; }
    .site-footer a:hover { color: #1a1a1a; }
    .site-footer a { color: #888; text-decoration: none; font-weight: 500; }
    .site-footer a:hover { color: #1a1a1a; }
    .emblem {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.9rem;
      color: #555;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }
    .button-group {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
    }
    .cta {
      position: relative;
      display: inline-block;
      text-align: center;
      padding: 0.8rem 1.2rem;
      border: 2px solid #1a1a1a;
      color: #1a1a1a;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s;
      margin: 0.4rem 0;
    }
    .cta::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 3px;
      bottom: 3px;
      width: 10px;
      background: #1a1a1a;
      background-image: radial-gradient(circle, #444 0.8px, transparent 0.8px);
      background-size: 3px 3px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .cta:hover::before {
      opacity: 1;
    }
    .cta:hover {
      background: #1a1a1a;
      color: #f5f5f0;
    }
    .sound-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      line-height: 1;
      z-index: 100;
    }
    .sound-toggle:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <button class="sound-toggle" id="soundToggle" title="Unmute sound">
    <svg id="iconMuted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <svg id="iconUnmuted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </button>
  <main>
    <img src="/docs/assets/logo.png" alt="Wiki Engine" class="emblem">
    <h1>Wiki Engine</h1>
    <p>Markdown-powered documentation engine</p>
    <div class="button-group">
      <a href="/docs/wiki/" class="cta">Enter Wiki</a>
      <a href="/docs/wiki/pages/guides/getting-started.html" class="cta">Getting Started</a>
      <a href="/docs/wiki/pages/reference/cheat-sheet.html" class="cta">Cheat Sheet</a>
    </div>
  </main>
  <footer class="site-footer">
    <span>&copy; 2026 Wiki Engine</span>
    <span>|</span>
    <span>Website design by <a href="https://github.com/vectorcmdr">vector_cmdr</a></span>
  </footer>
  <script>
    let muted = true;
    let audioCtx = null;

    const toggle = document.getElementById('soundToggle');
    const iconMuted = document.getElementById('iconMuted');
    const iconUnmuted = document.getElementById('iconUnmuted');

    toggle.addEventListener('click', () => {
      muted = !muted;
      iconMuted.style.display = muted ? '' : 'none';
      iconUnmuted.style.display = muted ? 'none' : '';
      toggle.title = muted ? 'Unmute sound' : 'Mute sound';
      if (!muted && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (!muted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });

    function playChime() {
      if (muted) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.04);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2400, now);
      gain2.gain.setValueAtTime(0.08, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
      osc2.connect(gain2).connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.025);
    }

    document.querySelectorAll('.cta').forEach(btn => {
      btn.addEventListener('mouseenter', playChime);
    });
  </script>
</body>
</html>
